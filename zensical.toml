[project]
site_url = "https://odyssey.atarigo.net/"
site_name = "Kenya Bike Odyssey"
site_description = "Weekend gravel ride: Bamboo Garden Lodge to Hell's Gate, August 2026"

nav = [
  { "Home" = "index.md" },
]

extra_css = ["https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"]

[project.theme]
language = "en"
features = [
  "navigation.top",
  "navigation.tracking",
  "content.tooltips",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.superfences = {}
